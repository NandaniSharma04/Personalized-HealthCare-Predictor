version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/healthcare
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  ml-service:
    build: ./ml
    command: uvicorn inference.server:app --host 0.0.0.0 --port 8500
    volumes:
      - ./ml:/ml
    ports:
      - "8500:8500"
    depends_on:
      - redis

volumes:
  pgdata:
